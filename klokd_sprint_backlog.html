<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klokd · Sprint Backlog v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#0A0A0F;--slate:#1A1A2E;--e:#00E5A0;--v:#BCFF4E;
  --mid:#6B7280;--mist:#F4F6F3;--soft:#E8EDE8;
  --amber:#FFB347;--purple:#A78BFA;--blue:#60A5FA;--err:#FF6B6B;
  --phase0:#FFB347;--phase1:#00E5A0;--phase2:#FFB347;
  --phase3:#A78BFA;--phase4:#60A5FA;--phase5:#00E5A0;
  --phase6:#F472B6;--phase7:#BCFF4E;
}
body{font-family:'Inter',sans-serif;background:#0A0A0F;color:#fff;min-height:100vh;-webkit-font-smoothing:antialiased;}

/* ── HEADER ── */
.header{background:#111827;border-bottom:1px solid rgba(255,255,255,.06);padding:0 24px;display:flex;align-items:center;gap:16px;height:56px;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.logo-k{width:28px;height:28px;background:linear-gradient(135deg,var(--e),var(--v));border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--ink);}
.logo-text{font-weight:900;font-size:15px;letter-spacing:-.04em;}
.header-tag{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--e);background:rgba(0,229,160,.1);padding:3px 8px;border-radius:999px;border:1px solid rgba(0,229,160,.2);}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.stat-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 12px;}
.stat-pill .num{font-size:12px;font-weight:700;color:var(--e);}
.stat-pill .lbl{font-size:10px;color:rgba(255,255,255,.35);}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 56px);}
.sidebar{background:#111827;border-right:1px solid rgba(255,255,255,.06);overflow-y:auto;padding:16px 0;}
.main{overflow-y:auto;padding:24px;}

/* ── SIDEBAR ── */
.sidebar-section{padding:0 12px;margin-bottom:4px;}
.sidebar-label{font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.2);padding:8px 8px 6px;display:block;}
.phase-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:none;cursor:pointer;background:transparent;font-family:inherit;transition:background .15s;}
.phase-btn:hover{background:rgba(255,255,255,.05);}
.phase-btn.active{background:rgba(0,229,160,.08);border:1px solid rgba(0,229,160,.18);}
.phase-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.phase-btn .pname{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.7);text-align:left;flex:1;}
.phase-btn.active .pname{color:#fff;}
.phase-btn .pcnt{font-size:10px;color:rgba(255,255,255,.25);}
.phase-btn.active .pcnt{color:var(--e);}
.sprint-btn{width:100%;display:flex;align-items:center;gap:8px;padding:5px 8px 5px 28px;border-radius:6px;border:none;cursor:pointer;background:transparent;font-family:inherit;transition:background .15s;}
.sprint-btn:hover{background:rgba(255,255,255,.04);}
.sprint-btn.active{background:rgba(255,255,255,.06);}
.sprint-btn .sname{font-size:10.5px;color:rgba(255,255,255,.45);text-align:left;flex:1;}
.sprint-btn.active .sname{color:rgba(255,255,255,.8);}
.sprint-btn .spts{font-size:9px;font-weight:600;color:rgba(255,255,255,.2);}

/* ── PHASE VIEW ── */
.phase-header{background:var(--slate);border-radius:14px;padding:20px 22px;margin-bottom:20px;border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden;}
.phase-header::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:14px 0 0 14px;}
.phase-header .ph-num{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;}
.phase-header .ph-title{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;}
.phase-header .ph-obj{font-size:11.5px;color:rgba(255,255,255,.45);line-height:1.65;margin-bottom:10px;}
.phase-header .ph-exit{font-size:10.5px;color:rgba(255,255,255,.35);line-height:1.55;}
.phase-stats{display:flex;gap:10px;margin-top:14px;}
.phase-stat{background:rgba(255,255,255,.05);border-radius:8px;padding:8px 14px;text-align:center;}
.phase-stat .psn{font-size:18px;font-weight:800;letter-spacing:-.03em;}
.phase-stat .psl{font-size:9px;color:rgba(255,255,255,.35);margin-top:2px;}

/* ── SPRINT CARD ── */
.sprint-card{background:var(--slate);border:1px solid rgba(255,255,255,.06);border-radius:12px;margin-bottom:16px;overflow:hidden;}
.sprint-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;}
.sprint-id{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;flex-shrink:0;}
.sprint-title{font-size:13px;font-weight:700;color:#fff;flex:1;}
.sprint-weeks{font-size:10px;color:rgba(255,255,255,.3);}
.sprint-pts-badge{background:rgba(0,229,160,.12);border:1px solid rgba(0,229,160,.25);border-radius:999px;padding:3px 10px;font-size:10px;font-weight:700;color:var(--e);}
.sprint-obj{padding:10px 18px;font-size:10.5px;color:rgba(255,255,255,.35);font-style:italic;background:rgba(255,255,255,.01);border-bottom:1px solid rgba(255,255,255,.04);}
.sprint-toggle{font-size:12px;color:rgba(255,255,255,.25);margin-left:8px;}

/* ── STORY TABLE ── */
.story-table{width:100%;border-collapse:collapse;}
.story-table th{padding:8px 14px;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25);text-align:left;border-bottom:1px solid rgba(255,255,255,.06);}
.story-row{border-bottom:.5px solid rgba(255,255,255,.04);cursor:pointer;transition:background .15s;}
.story-row:hover{background:rgba(255,255,255,.03);}
.story-row td{padding:12px 14px;vertical-align:top;}
.story-id{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:var(--e);white-space:nowrap;}
.story-text{font-size:11.5px;color:rgba(255,255,255,.75);line-height:1.55;}
.story-pts{font-size:14px;font-weight:800;letter-spacing:-.02em;text-align:center;}
.story-ac{font-size:10.5px;color:rgba(255,255,255,.35);line-height:1.6;}
.story-ac .ac-item{display:flex;gap:6px;margin-bottom:3px;}
.story-ac .ac-dot{flex-shrink:0;margin-top:3px;width:4px;height:4px;border-radius:50%;background:var(--e);opacity:.5;}

/* STATUS badges */
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:8.5px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s;white-space:nowrap;}
.status-badge.todo{background:rgba(255,255,255,.06);color:rgba(255,255,255,.35);}
.status-badge.progress{background:rgba(96,165,250,.12);color:#60A5FA;border:1px solid rgba(96,165,250,.25);}
.status-badge.done{background:rgba(0,229,160,.12);color:var(--e);border:1px solid rgba(0,229,160,.25);}
.status-badge.blocked{background:rgba(255,107,107,.1);color:var(--err);border:1px solid rgba(255,107,107,.2);}

/* ── DOD PANEL ── */
.dod-panel{background:var(--slate);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:20px;margin-bottom:20px;}
.dod-panel h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;}
.dod-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:.5px solid rgba(255,255,255,.04);cursor:pointer;}
.dod-item:last-child{border-bottom:none;}
.dod-check{width:18px;height:18px;border-radius:5px;border:1.5px solid rgba(255,255,255,.15);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px;}
.dod-check.checked{background:var(--e);border-color:var(--e);}
.dod-check svg{opacity:0;transition:opacity .15s;}
.dod-check.checked svg{opacity:1;}
.dod-text{font-size:11px;color:rgba(255,255,255,.55);line-height:1.55;}
.dod-text.checked{text-decoration:line-through;color:rgba(255,255,255,.2);}

/* ── OVERVIEW ── */
.overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px;}
.overview-card{background:var(--slate);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px 18px;}
.overview-card .oc-num{font-size:28px;font-weight:900;letter-spacing:-.04em;margin-bottom:4px;}
.overview-card .oc-lbl{font-size:10.5px;color:rgba(255,255,255,.35);}
.progress-bar{height:4px;background:rgba(255,255,255,.06);border-radius:999px;margin-top:10px;overflow:hidden;}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--e),var(--v));transition:width .4s cubic-bezier(.4,0,.2,1);}

.phase-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:24px;}
.phase-overview-card{background:var(--slate);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .2s;}
.phase-overview-card:hover{border-color:rgba(255,255,255,.15);}
.poc-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.poc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.poc-name{font-size:12px;font-weight:700;}
.poc-weeks{font-size:9.5px;color:rgba(255,255,255,.3);}
.poc-obj{font-size:10px;color:rgba(255,255,255,.35);line-height:1.55;margin-bottom:8px;}
.poc-stats{display:flex;gap:12px;}
.poc-stat .psn{font-size:13px;font-weight:800;color:var(--e);}
.poc-stat .psl{font-size:9px;color:rgba(255,255,255,.25);}

/* ── COMPLIANCE CRITICAL PATH ── */
.cp-table{width:100%;border-collapse:collapse;font-size:10.5px;}
.cp-table th{padding:8px 12px;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25);text-align:left;border-bottom:1px solid rgba(255,255,255,.08);}
.cp-table td{padding:10px 12px;border-bottom:.5px solid rgba(255,255,255,.04);color:rgba(255,255,255,.65);vertical-align:top;line-height:1.5;}
.cp-table tr:hover td{background:rgba(255,255,255,.02);}
.cp-p0{color:var(--err);}
.cp-p1{color:var(--amber);}

/* ── EXPORT BTN ── */
.export-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:rgba(255,255,255,.55);font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
.export-btn:hover{background:rgba(255,255,255,.1);color:#fff;}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:16px;}
.search-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 12px 8px 36px;color:#fff;font-size:11.5px;font-family:inherit;outline:none;transition:border-color .2s;}
.search-input:focus{border-color:rgba(0,229,160,.4);}
.search-input::placeholder{color:rgba(255,255,255,.2);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.25);}

/* SCROLLBARS */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:999px;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <div class="logo-k">K</div>
    <span class="logo-text">klokd</span>
  </div>
  <div class="header-tag">Sprint Backlog v1.0</div>
  <div class="header-right">
    <div class="stat-pill"><span class="num">23</span><span class="lbl">sprints</span></div>
    <div class="stat-pill"><span class="num">46</span><span class="lbl">weeks</span></div>
    <div class="stat-pill"><span class="num">387</span><span class="lbl">points</span></div>
    <div class="stat-pill" id="done-stat"><span class="num" id="done-count">0</span><span class="lbl">done</span></div>
    <button class="export-btn" onclick="exportCSV()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1V8M6 8L3.5 5.5M6 8L8.5 5.5M1 9.5V10.5C1 10.78 1.22 11 1.5 11H10.5C10.78 11 11 10.78 11 10.5V9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Export CSV
    </button>
  </div>
</div>

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section">
      <span class="sidebar-label">Navigation</span>
      <button class="phase-btn active" onclick="showView('overview')" id="btn-overview">
        <div class="phase-dot" style="background:linear-gradient(135deg,var(--e),var(--v));"></div>
        <span class="pname">Overview</span>
      </button>
      <button class="phase-btn" onclick="showView('dod')" id="btn-dod">
        <div class="phase-dot" style="background:var(--purple);"></div>
        <span class="pname">Definition of Done</span>
      </button>
      <button class="phase-btn" onclick="showView('compliance')" id="btn-compliance">
        <div class="phase-dot" style="background:var(--err);"></div>
        <span class="pname">Compliance Path</span>
      </button>
    </div>
    <div class="sidebar-section">
      <span class="sidebar-label">Phases</span>
      <div id="phase-nav"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main-content"></div>
</div>

<script>
// ── DATA ──
const PHASES = [
  {
    id:0, color:'#FFB347', label:'Phase 0', name:'Validation & Legal Foundation',
    weeks:'1–4', sprints:'S1–S2', points:41,

          {id:'S1-02',pts:3,story:'Stand up AWS dev/staging/production environments in af-south-1',ac:['Three environments created in af-south-1','RDS PostgreSQL provisioned with encryption','S3 buckets with encryption at rest'],status:'todo'},

          {id:'S1-04',pts:1,story:'Submit Safaricom production access application',ac:['Application submitted','Reference number filed'],status:'todo'},

          {id:'S2-05',pts:3,story:'Design and review base database schema with tenant_id on all tables',ac:['ERD approved by both founders','All core tables: users, workers, employers, shifts, shift_events, contracts, payments, compliance_records, audit_log','tenant_id on all tables confirmed'],status:'todo'},
          {id:'S2-06',pts:2,story:'Confirm AHL enforceability and set compliance engine toggle',ac:['Legal counsel confirms current status','Toggle set appropriately in config','Decision documented in Reboot Pack'],status:'todo'},

      },

  {

      {

        stories:[
          {id:'S5-01',pts:5,story:'Build GET /shifts/:id/applicants — ranked worker list for employer',ac:['Sorted: distance ASC, rating DESC, show-up rate DESC','Worker card: name, show-up rate, rating (if ≥3 shifts), distance, skills, certs'],status:'todo'},
          {id:'S5-02',pts:3,story:'Build shift confirmation — employer selects worker, others notified',ac:['Shift status: confirmed','Worker and other applicants notified','ShiftEventLog: posted→confirmed'],status:'todo'},

  phase: ['All sprints in phase meet sprint-level DoD','Phase deliverables demonstrated to external stakeholder','Legal/compliance dependencies for next phase confirmed','Infrastructure costs reviewed against budget','Investor update prepared and sent (if milestone)'],
  mvp: ['All Phase 0–7 sprints meet sprint-level DoD','50 employers + 200 workers onboarded and active','End-to-end shift flow: post → match → clock-in → clock-out → M-Pesa → rating','WIBA hard gate confirmed blocking uncovered shifts','Minimum wage gate confirmed blocking below-minimum shifts','Section 37 alert triggering at correct thresholds','Real KES disbursed to real M-Pesa number via Daraja production','Escrow auto-release confirmed at 4 hours post clock-out','ODPC registered as Data Controller and Data Processor','Privacy Policy published · DPAs executed with all processors','All data confirmed in AWS af-south-1 only','API P95 < 500ms under 80 concurrent users','Load test: 80 VUs, 30 minutes, zero errors','KRA PIN obtained · PAYE filing setup on iTax','NSSF and SHIF (SHA) registrations complete'],
};
Object.entries(DOD_ITEMS).forEach(([k,items]) => {
  dodState[k] = items.map(() => false);
});

// ── RENDER ──
function totalDone(){
  return Object.values(storyStatuses).filter(s=>s==='done').length;
}
function totalStories(){
  return Object.keys(storyStatuses).length;
}
function updateHeader(){
  document.getElementById('done-count').textContent = totalDone();
}

function showView(v, phaseId, sprintId){
  currentView = v;
  currentPhase = phaseId !== undefined ? phaseId : currentPhase;
  currentSprint = sprintId || null;
  renderSidebar();
  renderMain();
  updateHeader();
}

function renderSidebar(){
  const nav = document.getElementById('phase-nav');
  nav.innerHTML = PHASES.map(p => {
    const done = p.sprints_data.flatMap(s=>s.stories).filter(st=>storyStatuses[st.id]==='done').length;
    const total = p.sprints_data.flatMap(s=>s.stories).length;
    const isActive = currentView==='phase' && currentPhase===p.id;
    let html = `<div class="sidebar-section" style="padding:0 12px;">
      <button class="phase-btn ${isActive?'active':''}" onclick="showView('phase',${p.id})">
        <div class="phase-dot" style="background:${p.color};"></div>
        <span class="pname">${p.label}: ${p.name.split(' ').slice(0,3).join(' ')}</span>
        <span class="pcnt">${done}/${total}</span>
      </button>`;
    if(isActive){
      html += p.sprints_data.map(s=>{
        const sDone = s.stories.filter(st=>storyStatuses[st.id]==='done').length;
        const isActiveSprint = currentSprint===s.id;
        return `<button class="sprint-btn ${isActiveSprint?'active':''}" onclick="showView('sprint',${p.id},'${s.id}')">
          <span class="sname">${s.label} · W${s.weeks}</span>
          <span class="spts">${sDone}/${s.stories.length}</span>
        </button>`;
      }).join('');
    }
    html += '</div>';
    return html;
  }).join('');

  // Update top nav buttons
  ['overview','dod','compliance'].forEach(v => {
    const btn = document.getElementById(`btn-${v}`);
    if(btn) btn.classList.toggle('active', currentView===v);
  });
}

function renderMain(){
  const main = document.getElementById('main-content');
  if(currentView==='overview') main.innerHTML = renderOverview();
  else if(currentView==='dod') main.innerHTML = renderDoD();
  else if(currentView==='compliance') main.innerHTML = renderCompliance();
  else if(currentView==='phase') main.innerHTML = renderPhase();
  else if(currentView==='sprint') main.innerHTML = renderSprint();
}

function renderOverview(){
  const done = totalDone(), total = totalStories();
  const pct = Math.round(done/total*100);
  const totalPts = PHASES.reduce((a,p)=>a+p.points,0);
  const donePts = PHASES.reduce((a,p)=>a+p.sprints_data.flatMap(s=>s.stories).filter(st=>storyStatuses[st.id]==='done').reduce((b,st)=>b+st.pts,0),0);
  return `
    <div style="max-width:900px;">
      <div style="margin-bottom:20px;">
        <div style="font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:6px;">Klokd · MVP Sprint Backlog</div>
        <div style="font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px;">Product Overview</div>
        <div style="font-size:12px;color:rgba(255,255,255,.35);">23 sprints · 46 weeks · 387 story points · Nairobi beachhead · Controlled beta launch</div>
      </div>

      <div class="overview-grid">
        <div class="overview-card">
          <div class="oc-num" style="color:var(--e);">${done}<span style="font-size:14px;color:rgba(255,255,255,.25)">/${total}</span></div>
          <div class="oc-lbl">Stories complete</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="overview-card">
          <div class="oc-num" style="color:var(--v);">23</div>
          <div class="oc-lbl">Total sprints</div>
        </div>
        <div class="overview-card">
          <div class="oc-num" style="color:var(--amber);">46</div>
          <div class="oc-lbl">Weeks to beta</div>
        </div>
        <div class="overview-card">
          <div class="oc-num" style="color:var(--purple);">${donePts}<span style="font-size:14px;color:rgba(255,255,255,.25)">/${totalPts}</span></div>
          <div class="oc-lbl">Story points</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(donePts/totalPts*100)}%;"></div></div>
        </div>
      </div>

      <div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.2);margin-bottom:12px;">Phases</div>
      <div class="phase-grid">
        ${PHASES.map(p=>{
          const done = p.sprints_data.flatMap(s=>s.stories).filter(st=>storyStatuses[st.id]==='done').length;
          const total = p.sprints_data.flatMap(s=>s.stories).length;
          const pct = total>0?Math.round(done/total*100):0;
          return `<div class="phase-overview-card" onclick="showView('phase',${p.id})">
            <div class="poc-top">
              <div class="poc-dot" style="background:${p.color};"></div>
              <div>
                <div class="poc-name">${p.label}</div>
                <div class="poc-weeks">Weeks ${p.weeks}</div>
              </div>
            </div>
            <div class="poc-obj">${p.name}</div>
            <div class="poc-stats">
              <div class="poc-stat"><div class="psn">${p.points}</div><div class="psl">pts</div></div>
              <div class="poc-stat"><div class="psn">${p.sprints_data.length}</div><div class="psl">sprints</div></div>
              <div class="poc-stat"><div class="psn">${done}/${total}</div><div class="psl">done</div></div>
            </div>
            <div class="progress-bar" style="margin-top:10px;"><div class="progress-fill" style="width:${pct}%;background:${p.color};"></div></div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function statusBadge(storyId){
  const s = storyStatuses[storyId];
  return `<button class="status-badge ${s}" onclick="cycleStatus('${storyId}',event)">${STATUS_LABELS[s]}</button>`;
}
window.cycleStatus = function(id, e){
  e.stopPropagation();
  const i = STATUSES.indexOf(storyStatuses[id]);
  storyStatuses[id] = STATUSES[(i+1)%STATUSES.length];
  updateHeader();
  renderMain();
  renderSidebar();
};

function ptColor(p){ return p>=5?'#FF6B6B':p>=3?'#FFB347':'#00E5A0'; }

function renderStoryTable(stories, search=''){
  const filtered = search ? stories.filter(st=>
    st.story.toLowerCase().includes(search) || st.id.toLowerCase().includes(search)
  ) : stories;
  if(!filtered.length) return '<div style="padding:20px;text-align:center;color:rgba(255,255,255,.2);font-size:11px;">No stories match your search.</div>';
  return `<table class="story-table">
    <thead><tr>
      <th style="width:70px;">ID</th>
      <th>User Story</th>
      <th style="width:40px;text-align:center;">Pts</th>
      <th style="width:200px;">Acceptance Criteria</th>
      <th style="width:100px;">Status</th>
    </tr></thead>
    <tbody>
    ${filtered.map(st=>`
      <tr class="story-row">
        <td><span class="story-id">${st.id}</span></td>
        <td><span class="story-text">${st.story}</span></td>
        <td style="text-align:center;"><span class="story-pts" style="color:${ptColor(st.pts)};">${st.pts}</span></td>
        <td><div class="story-ac">${st.ac.map(a=>`<div class="ac-item"><div class="ac-dot"></div><span>${a}</span></div>`).join('')}</div></td>
        <td>${statusBadge(st.id)}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderPhase(){
  const p = PHASES[currentPhase];
  if(!p) return '<div style="padding:40px;color:rgba(255,255,255,.3);">Select a phase from the sidebar.</div>';
  const allStories = p.sprints_data.flatMap(s=>s.stories);
  const done = allStories.filter(st=>storyStatuses[st.id]==='done').length;
  const pts = allStories.reduce((a,st)=>a+st.pts,0);
  const donePts = allStories.filter(st=>storyStatuses[st.id]==='done').reduce((a,st)=>a+st.pts,0);
  return `
    <div style="max-width:900px;">
      <div class="phase-header" style="--c:${p.color};">
        <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${p.color};border-radius:14px 0 0 14px;"></div>
        <div class="ph-num" style="color:${p.color};">${p.label} · Weeks ${p.weeks}</div>
        <div class="ph-title">${p.name}</div>
        <div class="ph-obj">${p.objective}</div>
        <div class="ph-exit"><span style="color:${p.color};font-weight:600;">Exit: </span>${p.exit}</div>
        <div class="phase-stats">
          <div class="phase-stat"><div class="psn" style="color:${p.color};">${p.sprints_data.length}</div><div class="psl">sprints</div></div>
          <div class="phase-stat"><div class="psn" style="color:${p.color};">${pts}</div><div class="psl">total pts</div></div>
          <div class="phase-stat"><div class="psn" style="color:${p.color};">${done}/${allStories.length}</div><div class="psl">done</div></div>
          <div class="phase-stat"><div class="psn" style="color:${p.color};">${donePts}/${pts}</div><div class="psl">pts done</div></div>
        </div>
      </div>
      ${p.sprints_data.map(s=>renderSprintCard(s,p)).join('')}
    </div>`;
}

function renderSprintCard(s, p){
  const done = s.stories.filter(st=>storyStatuses[st.id]==='done').length;
  const isCollapsed = collapsed[s.id];
  return `
    <div class="sprint-card">
      <div class="sprint-head" onclick="toggleCollapse('${s.id}')">
        <span class="sprint-id" style="background:${p.color}18;color:${p.color};border:1px solid ${p.color}35;">${s.label}</span>
        <span class="sprint-title">${s.obj.split('·')[0].trim()}</span>
        <span class="sprint-weeks">Weeks ${s.weeks}</span>
        <span class="sprint-pts-badge">${done}/${s.stories.length} · ${s.pts}pts</span>
        <span class="sprint-toggle">${isCollapsed?'▶':'▼'}</span>
      </div>
      <div class="sprint-obj">${s.obj}</div>
      ${isCollapsed?'':`<div style="overflow-x:auto;">${renderStoryTable(s.stories)}</div>`}
    </div>`;
}

window.toggleCollapse = function(id){
  collapsed[id] = !collapsed[id];
  renderMain();
};

function renderSprint(){
  const p = PHASES[currentPhase];
  if(!p) return '';
  const s = p.sprints_data.find(sp=>sp.id===currentSprint);
  if(!s) return '';
  const done = s.stories.filter(st=>storyStatuses[st.id]==='done').length;
  return `
    <div style="max-width:900px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <button onclick="showView('phase',${p.id})" style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 12px;color:rgba(255,255,255,.45);font-size:11px;cursor:pointer;font-family:inherit;">← ${p.label}</button>
        <span style="font-size:18px;font-weight:800;letter-spacing:-.02em;">${s.label} — ${s.obj.split('·')[0].trim()}</span>
      </div>
      <div class="sprint-card">
        <div class="sprint-head" style="cursor:default;">
          <span class="sprint-id" style="background:${p.color}18;color:${p.color};">${s.label}</span>
          <span class="sprint-title">Weeks ${s.weeks}</span>
          <span class="sprint-pts-badge">${done}/${s.stories.length} stories · ${s.pts} points</span>
        </div>
        <div class="sprint-obj">${s.obj}</div>
        <div style="overflow-x:auto;">${renderStoryTable(s.stories)}</div>
      </div>
    </div>`;
}

function renderDoD(){
  const LABELS = {story:'Story-Level DoD',sprint:'Sprint-Level DoD',phase:'Phase-Level DoD',mvp:'MVP DoD — Beta-Ready'};
  const COLORS = {story:'var(--e)',sprint:'var(--purple)',phase:'var(--blue)',mvp:'var(--amber)'};
  return `
    <div style="max-width:720px;">
      <div style="margin-bottom:20px;">
        <div style="font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px;">Definition of Done</div>
        <div style="font-size:11.5px;color:rgba(255,255,255,.35);">Check off items as they are validated. State persists during this session.</div>
      </div>
      ${Object.entries(DOD_ITEMS).map(([k,items])=>{
        const done = dodState[k].filter(Boolean).length;
        const pct = Math.round(done/items.length*100);
        return `
          <div class="dod-panel">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
              <h3 style="color:${COLORS[k]};">${LABELS[k]}</h3>
              <span style="font-size:10px;color:rgba(255,255,255,.3);">${done}/${items.length} · ${pct}%</span>
            </div>
            <div class="progress-bar" style="margin-bottom:14px;"><div class="progress-fill" style="width:${pct}%;background:${COLORS[k]};"></div></div>
            ${items.map((item,i)=>`
              <div class="dod-item" onclick="toggleDod('${k}',${i})">
                <div class="dod-check ${dodState[k][i]?'checked':''}">
                  <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5L4.5 7.5L8.5 3" stroke="${dodState[k][i]?'#0A0A0F':'transparent'}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <span class="dod-text ${dodState[k][i]?'checked':''}">${item}</span>
              </div>`).join('')}
          </div>`;
      }).join('')}
    </div>`;
}

window.toggleDod = function(k, i){
  dodState[k][i] = !dodState[k][i];
  renderMain();
};

function renderCompliance(){
  const items = [
    {action:'Legal opinion: PAYE/NSSF/WIBA/entity classification',owner:'Chamia',deadline:'End Sprint 1',blocks:'Everything',priority:'P0'},
    {action:'ODPC Data Controller + Processor registration confirmed',owner:'Chamia',deadline:'End Sprint 2',blocks:'Sprint 8 — identity data collection',priority:'P0'},
    {action:'KRA PIN obtained',owner:'Chamia',deadline:'End Sprint 1',blocks:'Sprint 19 — PAYE remittance',priority:'P0'},
    {action:'WIBA coverage option confirmed (A or B)',owner:'Ivy',deadline:'End Sprint 2',blocks:'Sprint 6 — clock-in gate',priority:'P0'},
    {action:'AHL enforceability status confirmed',owner:'Legal counsel',deadline:'End Sprint 2',blocks:'Sprint 7 — Compliance Engine build',priority:'P1'},
    {action:'Escrow model / CBK licensing position confirmed',owner:'Legal counsel',deadline:'End Sprint 2',blocks:'Sprint 16 — Payment Service',priority:'P1'},
    {action:'Minimum wage schedules for hospitality/health/retail obtained',owner:'Developer',deadline:'End Phase 1',blocks:'Sprint 7 — minimum wage gate',priority:'P1'},
    {action:'DPAs executed: AWS, Safaricom, WhatsApp, Africa\'s Talking',owner:'Chamia',deadline:'Before Sprint 22',blocks:'Go-live',priority:'P1'},
    {action:'Daraja B2C production keys obtained',owner:'Chamia',deadline:'Before Sprint 16',blocks:'Payment Service',priority:'P1'},
    {action:'DPIA completed',owner:'Ivy + Legal',deadline:'Before Sprint 8',blocks:'Worker onboarding / data collection',priority:'P1'},
    {action:'Privacy Policy published on platform',owner:'Legal',deadline:'Before Sprint 22',blocks:'DPA 2019 compliance',priority:'P2'},
    {action:'Data breach response plan documented and tooled',owner:'Chamia + Developer',deadline:'Before Sprint 22',blocks:'ODPC DPA s.43 compliance',priority:'P2'},
  ];
  return `
    <div style="max-width:900px;">
      <div style="margin-bottom:20px;">
        <div style="font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px;">Compliance Critical Path</div>
        <div style="font-size:11.5px;color:rgba(255,255,255,.35);">These actions must complete before the sprint that depends on them. Missing these blocks development.</div>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:16px;">
        <div style="display:flex;align-items:center;gap:6px;font-size:10px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--err);display:inline-block;"></span><span style="color:rgba(255,255,255,.4);">P0 — blocks everything</span></div>
        <div style="display:flex;align-items:center;gap:6px;font-size:10px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block;"></span><span style="color:rgba(255,255,255,.4);">P1 — blocks named sprint</span></div>
        <div style="display:flex;align-items:center;gap:6px;font-size:10px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block;"></span><span style="color:rgba(255,255,255,.4);">P2 — blocks go-live</span></div>
      </div>
      <div style="background:var(--slate);border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden;">
        <table class="cp-table" style="width:100%;">
          <thead><tr>
            <th>Action</th><th>Owner</th><th>Deadline</th><th>Blocks</th><th>Priority</th>
          </tr></thead>
          <tbody>
          ${items.map(item=>{
            const c = item.priority==='P0'?'var(--err)':item.priority==='P1'?'var(--amber)':'var(--blue)';
            return `<tr>
              <td style="font-weight:600;color:rgba(255,255,255,.75);">${item.action}</td>
              <td style="color:var(--e);">${item.owner}</td>
              <td style="white-space:nowrap;">${item.deadline}</td>
              <td>${item.blocks}</td>
              <td><span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:999px;background:${c}18;color:${c};border:1px solid ${c}35;">${item.priority}</span></td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

// ── EXPORT ──
window.exportCSV = function(){
  const rows = [['Phase','Sprint','Story ID','Story','Points','AC','Status']];
  PHASES.forEach(p=>p.sprints_data.forEach(s=>s.stories.forEach(st=>{
    rows.push([p.label,s.label,st.id,`"${st.story.replace(/"/g,'""')}"`,st.pts,`"${st.ac.join(' | ').replace(/"/g,'""')}"`,storyStatuses[st.id]]);
  })));
  const csv = rows.map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'klokd_sprint_backlog.csv';
  a.click();
};

// ── INIT ──
renderSidebar();
renderMain();
</script>
</body>
</html>
